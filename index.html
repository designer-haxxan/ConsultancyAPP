<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="VisaFlow Pakistan: visa consultancy software for clients, documents, appointments, fees and decisions for every country. Works offline.">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VisaFlow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <title>VisaFlow Pakistan</title>
</head>
<body>
  <!-- Splash while the local database opens -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo"><img src="icons/icon.svg" alt=""></div>
      <div class="splash-name">VisaFlow Pakistan</div>
      <div class="spinner" role="status"><span class="visually-hidden">Loading</span></div>
      <div id="splash-error" class="splash-error"></div>
    </div>
  </div>

  <!-- Sign-in and first-time setup -->
  <div id="view-auth" hidden></div>

  <!-- Application shell -->
  <div id="view-app" hidden>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside id="sidebar" aria-label="Main navigation">
      <div class="sb-brand">
        <div class="brand-mark sm"><img src="icons/icon.svg" alt=""></div>
        <div class="sb-text"><div id="brand-name" class="sb-name">VisaFlow</div><div class="sb-tag">Visa consultancy · Pakistan</div></div>
      </div>
      <nav id="sidebar-nav" class="sb-nav"></nav>
      <div class="sb-foot">
        <div class="sb-offline"><i class="bi bi-hdd"></i> All data is saved on this device</div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <button id="search-btn" class="icon-btn" type="button" aria-label="Search (Ctrl+K)" title="Search (Ctrl+K)"><i class="bi bi-search"></i></button>
        <button id="quick-btn" class="btn btn-primary btn-sm topbar-new" type="button"><i class="bi bi-plus-lg"></i><span>New</span></button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <div class="user-wrap">
          <button id="user-menu-btn" class="avatar-btn" type="button" aria-label="Account menu" aria-haspopup="true"><span id="user-avatar">?</span></button>
          <div id="user-menu" class="user-menu" role="menu">
            <div class="um-head"><b id="user-name"></b><small id="user-role"></small></div>
            <button type="button" id="lock-btn" role="menuitem"><i class="bi bi-lock"></i> Lock screen</button>
            <button type="button" id="logout-btn" role="menuitem" class="danger"><i class="bi bi-box-arrow-right"></i> Sign out</button>
          </div>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>

    <nav id="bottom-nav" aria-label="Quick navigation">
      <a href="#/dashboard" data-route="dashboard"><i class="bi bi-house-door"></i><span>Home</span></a>
      <a href="#/cases" data-route="cases"><i class="bi bi-kanban"></i><span>Cases</span></a>
      <button type="button" id="bottom-quick" class="nav-fab" aria-label="Add new"><i class="bi bi-plus-lg"></i></button>
      <a href="#/clients" data-route="clients"><i class="bi bi-people"></i><span>Clients</span></a>
      <a href="#" id="bottom-more"><i class="bi bi-grid-3x3-gap"></i><span>More</span></a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-container" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>

  <noscript><div class="noscript">JavaScript is required to run VisaFlow.</div></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
